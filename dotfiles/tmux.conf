#############################
#          GENERAL          #
#############################

# Base index 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Mouse (scroll, select; tmux-yank copies the selection)
set -g mouse on

# Vi keys
setw -g mode-keys vi

# Activity notifications
setw -g monitor-activity on
set -g visual-activity on

set -s escape-time 0
# Pass focus in/out to programs (nvim autoread, FocusGained). Clients must
# detach and re-attach for a change here to take effect.
set -g focus-events on

#############################
#          BINDINGS         #
#############################

# C-a instead of C-b
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Split bindings
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Quick .tmux.conf reload
bind r source-file ~/.tmux.conf

#############################
#           DESIGN          #
#############################

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

set-option -g default-shell /bin/zsh

# Status line. Colours, formats, bell style and the pane borders come from
# catppuccin (see PLUGINS); only what the theme leaves alone is set here.
set -g status-position bottom
set -g status-interval 15

#############################
#           PLUGINS         #
#############################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Pinned: to move versions bump the tag here, then prefix+I (prefix+U can't
# pull a tag checkout). v2 renamed @catppuccin_flavour to @catppuccin_flavor
# and no longer sets the status line itself; it is assembled below.
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'rounded'
# v2 defaults the tab text to the pane title (#T), which under the omz
# terminal title reads "user@host path"; show the window name instead (the
# directory is a module on the right).
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Status line modules (must come after the theme has loaded)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
